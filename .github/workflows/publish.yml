name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - show workspace and files
        run: |
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          pwd
          ls -la
          echo "ls github workspace root:"
          ls -la "${GITHUB_WORKSPACE}" || true
          echo "ls repo subdir (if exists):"
          ls -la "${GITHUB_WORKSPACE}/swtipy" || true
          if [ -f "${GITHUB_WORKSPACE}/pyproject.toml" ]; then
            echo "---- pyproject.toml ----"
            sed -n '1,200p' "${GITHUB_WORKSPACE}/pyproject.toml"
            echo "------------------------"
          else
            echo "No pyproject.toml at ${GITHUB_WORKSPACE}"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
        working-directory: ${{ github.workspace }}

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    environment:
      name: pypi
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          packages-dir: dist/
