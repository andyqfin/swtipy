name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show workspace
        run: |
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          pwd
          ls -la "${GITHUB_WORKSPACE}"
          find "${GITHUB_WORKSPACE}" -maxdepth 3 -type f -name "pyproject.toml" -print || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          if [ -f "${GITHUB_WORKSPACE}/pyproject.toml" ]; then
            cd "${GITHUB_WORKSPACE}"
          elif [ -f "${GITHUB_WORKSPACE}/swtipy/pyproject.toml" ]; then
            cd "${GITHUB_WORKSPACE}/swtipy"
          else
            echo "No pyproject.toml found"; exit 1
          fi
          python -m build

      - name: Upload dists
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          packages-dir: dist/
