name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show workspace (debug)
        run: |
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          pwd
          ls -la "${GITHUB_WORKSPACE}"
          echo "Find pyproject.toml (maxdepth 3):"
          find "${GITHUB_WORKSPACE}" -maxdepth 3 -type f -name "pyproject.toml" -print || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build distributions (try root then swtipy/)
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          echo "Try building from repo root..."
          if python -m build "${GITHUB_WORKSPACE}"; then
            echo "Built from repo root"
          else
            echo "Build from repo root failed, trying swtipy/ subfolder..."
            if python -m build "${GITHUB_WORKSPACE}/swtipy"; then
              echo "Built from swtipy/ subfolder"
            else
              echo "ERROR: build failed in both repo root and swtipy/"; exit 1
            fi
          fi

      - name: Upload dists
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          packages-dir: dist/
